<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a1630" />
    <title>Joyeux anniversaire</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Great+Vibes&family=Playfair+Display:wght@400;500&family=Jost:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --jaune: #ffd166;
        --jaune-rgb: 255, 209, 102;
        --pale: #b9d3ff;
        --pale-rgb: 185, 211, 255;
        --bleu: #0a1630;
        --bleu2: #10224a;
        --bleu-roi: #12285a;
        --blanc: #f4f7ff;
        --gris: #8ea3c9;
        --rose: #f2a1ac;
        --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        font-family: "Jost", sans-serif;
        font-weight: 300;
        background: var(--bleu);
        color: var(--blanc);
        line-height: 1.7;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }
      body.verrou {
        overflow: hidden;
        height: 100svh;
      }
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 300;
        opacity: 0.06;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      }

      /* ===== Trait qui se dessine (commun) ===== */
      .trace {
        fill: none;
        stroke: var(--jaune);
        stroke-width: 1.2;
        vector-effect: non-scaling-stroke;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
      }
      @keyframes dessiner {
        to {
          stroke-dashoffset: 0;
        }
      }

      /* ===== Typo ===== */
      .surtitre {
        font: 500 0.7rem "Jost";
        letter-spacing: 0.38em;
        text-transform: uppercase;
        color: var(--pale);
      }
      h2 {
        font-family: "Cormorant Garamond", serif;
        font-style: italic;
        font-weight: 500;
        font-size: clamp(2.5rem, 10vw, 3.6rem);
        line-height: 1.1;
        margin: 14px 0 10px;
      }
      .sous {
        font-family: "Cormorant Garamond", serif;
        font-style: italic;
        font-size: 1.15rem;
        color: var(--gris);
      }
      .filet {
        width: 60px;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--jaune),
          transparent
        );
        margin: 26px auto 44px;
        position: relative;
        transform: scaleX(0);
        transition: transform 1.4s var(--ease) 0.5s;
      }
      .filet::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        width: 6px;
        height: 6px;
        margin: -3px;
        background: var(--jaune);
        transform: rotate(45deg) scale(0);
        transition: transform 0.6s var(--ease) 1.6s;
      }
      .visible .filet {
        transform: scaleX(1);
      }
      .visible .filet::after {
        transform: rotate(45deg) scale(1);
      }

      /* ===== Sections ===== */
      .chap {
        position: relative;
      }
      .sombre {
        background: var(--bleu);
      }
      .sombre + .sombre {
        border-top: 1px solid rgba(var(--jaune-rgb), 0.14);
      }
      .clair {
        background: radial-gradient(
          ellipse at 50% 0%,
          #1f4189 0%,
          var(--bleu-roi) 52%,
          #0e2049 100%
        );
      }
      .inner {
        max-width: 620px;
        margin: 0 auto;
        padding: 110px 20px 70px;
        text-align: center;
      }
      .suite {
        margin-top: 70px;
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        cursor: pointer;
        color: var(--gris);
      }
      .suite em {
        font-family: "Cormorant Garamond";
        font-size: 1.15rem;
      }
      .suite i {
        position: relative;
        width: 1px;
        height: 54px;
        background: rgba(var(--jaune-rgb), 0.25);
        overflow: hidden;
      }
      .suite i::after {
        content: "";
        position: absolute;
        left: 0;
        top: -30%;
        width: 1px;
        height: 30%;
        background: var(--jaune);
        animation: descend 2s var(--ease) infinite;
      }
      @keyframes descend {
        to {
          top: 100%;
        }
      }

      /* ===== Barre, relance, musique ===== */
      #progression {
        position: fixed;
        top: 0;
        left: 0;
        height: 2px;
        width: 0;
        z-index: 60;
        background: linear-gradient(90deg, var(--pale), var(--jaune));
      }
      #relance {
        position: fixed;
        left: 50%;
        bottom: 22px;
        z-index: 50;
        transform: translate(-50%, 140px);
        background: rgba(10, 22, 48, 0.85);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        color: var(--pale);
        border: 1px solid rgba(var(--jaune-rgb), 0.5);
        border-radius: 999px;
        padding: 12px 22px;
        font: 500 0.68rem "Jost";
        letter-spacing: 0.25em;
        text-transform: uppercase;
        transition: transform 0.7s var(--ease);
        cursor: pointer;
        white-space: nowrap;
      }
      #relance.montre {
        transform: translate(-50%, 0);
      }
      #btnMusique {
        position: fixed;
        right: 16px;
        top: 16px;
        z-index: 55;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        border: 1px solid rgba(var(--jaune-rgb), 0.6);
        background: rgba(10, 22, 48, 0.6);
        backdrop-filter: blur(8px);
        color: var(--pale);
        font-size: 1rem;
        cursor: pointer;
        display: none;
      }
      #btnMusique.joue {
        animation: tourne 4s linear infinite;
      }
      @keyframes tourne {
        to {
          transform: rotate(360deg);
        }
      }

      /* ===== Verrou ===== */
      #verrou {
        position: fixed;
        inset: 0;
        z-index: 200;
      }
      .porte {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 50.5%;
        background: radial-gradient(
          circle at 100% 50%,
          #18336f,
          var(--bleu) 70%
        );
        transition: transform 1.6s cubic-bezier(0.75, 0, 0.2, 1) 0.5s;
      }
      .porte.g {
        left: 0;
        border-right: 1px solid rgba(var(--jaune-rgb), 0.45);
      }
      .porte.d {
        right: 0;
        border-left: 1px solid rgba(var(--jaune-rgb), 0.45);
        background: radial-gradient(circle at 0% 50%, #18336f, var(--bleu) 70%);
      }
      #verrou.ouvert .porte.g {
        transform: translateX(-101%);
      }
      #verrou.ouvert .porte.d {
        transform: translateX(101%);
      }
      .v-contenu {
        position: relative;
        z-index: 2;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
        text-align: center;
        transition:
          opacity 0.6s,
          transform 0.6s;
      }
      #verrou.ouvert .v-contenu {
        opacity: 0;
        transform: scale(0.96);
      }
      .monogramme {
        width: 68px;
        height: 68px;
        border: 1px solid var(--jaune);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font: 400 2.4rem "Great Vibes";
        color: var(--pale);
        margin-bottom: 22px;
      }
      .v-contenu h1 {
        font: italic 500 clamp(1.9rem, 8vw, 2.5rem) "Cormorant Garamond";
        margin: 10px 0 8px;
      }
      .indice {
        font: italic 1.05rem "Cormorant Garamond";
        color: var(--gris);
        max-width: 300px;
      }
      .cases {
        display: flex;
        gap: 14px;
        margin: 30px 0 8px;
      }
      .cases span {
        width: 26px;
        height: 34px;
        border-bottom: 1px solid rgba(var(--jaune-rgb), 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: border-color 0.3s;
      }
      .cases span::after {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--jaune);
        transform: scale(0);
        transition: transform 0.3s var(--ease);
      }
      .cases span.pleine::after {
        transform: scale(1);
      }
      .cases.erreur {
        animation: secoue 0.5s;
      }
      .cases.erreur span {
        border-color: var(--rose);
      }
      .cases.erreur span::after {
        background: var(--rose);
      }
      .cases.ok span {
        border-color: var(--jaune);
      }
      @keyframes secoue {
        20%,
        60% {
          transform: translateX(-9px);
        }
        40%,
        80% {
          transform: translateX(9px);
        }
      }
      #erreurCode {
        min-height: 1.6em;
        font: italic 1rem "Cormorant Garamond";
        color: var(--rose);
      }
      .clavier {
        display: grid;
        grid-template-columns: repeat(3, 68px);
        gap: 14px 22px;
        margin-top: 14px;
      }
      .clavier button {
        width: 68px;
        height: 68px;
        border-radius: 50%;
        border: 1px solid rgba(var(--jaune-rgb), 0.3);
        background: rgba(255, 255, 255, 0.03);
        color: var(--blanc);
        font: 400 1.7rem "Cormorant Garamond";
        cursor: pointer;
        transition:
          background 0.25s,
          border-color 0.25s,
          transform 0.15s;
      }
      .clavier button:active {
        background: rgba(var(--jaune-rgb), 0.2);
        border-color: var(--jaune);
        transform: scale(0.94);
      }
      .clavier button.vide {
        visibility: hidden;
      }
      .clavier button.eff {
        border: 0;
        background: none;
        font: 400 0.65rem "Jost";
        letter-spacing: 0.2em;
        color: var(--gris);
      }

      /* ===== Hero ===== */
      .hero {
        position: relative;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 40px 24px;
        overflow: hidden;
        background: radial-gradient(
          ellipse at 50% 40%,
          #183670 0%,
          #10265a 40%,
          var(--bleu) 80%
        );
      }
      .hero::before {
        content: "";
        position: absolute;
        width: 130vmax;
        height: 130vmax;
        left: 50%;
        top: 50%;
        margin: -65vmax;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(var(--pale-rgb), 0.13),
          transparent 55%
        );
        animation: derive 16s ease-in-out infinite alternate;
      }
      @keyframes derive {
        0% {
          transform: translate(-18%, -12%);
        }
        100% {
          transform: translate(16%, 14%);
        }
      }
      .hero > * {
        position: relative;
        z-index: 2;
      }
      .hero > .cadre-trace {
        position: absolute;
        left: 16px;
        top: 16px;
        width: calc(100% - 32px);
        height: calc(100% - 32px);
        overflow: visible;
        pointer-events: none;
        z-index: 1;
      }
      .cadre-trace rect {
        stroke: rgba(var(--jaune-rgb), 0.55);
      }
      .hero.anime .cadre-trace rect {
        animation: dessiner 3.2s cubic-bezier(0.6, 0, 0.2, 1) 0.2s forwards;
      }
      .hero .surtitre span {
        display: inline-block;
        opacity: 0;
        transform: translateY(8px);
        transition:
          opacity 1s,
          transform 1s var(--ease);
      }
      .hero.anime .surtitre span {
        opacity: 1;
        transform: none;
      }
      .nom-svg {
        width: 100%;
        max-width: 560px;
        height: auto;
        max-height: 32svh;
        overflow: visible;
        margin: 8px 0 4px;
      }
      .nom-svg text {
        font-family: "Great Vibes", cursive;
        font-size: 150px;
        fill: url(#gNom);
        fill-opacity: 0;
        stroke: var(--pale);
        stroke-width: 1.1;
        vector-effect: non-scaling-stroke;
      }
      .nom-svg tspan {
        stroke-dasharray: 3000;
        stroke-dashoffset: 3000;
      }
      .nom-svg.ecrit tspan {
        animation: plume 1.6s cubic-bezier(0.5, 0, 0.3, 1) forwards;
      }
      .nom-svg.ecrit text {
        animation: remplir 1.4s ease forwards;
      }
      @keyframes plume {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes remplir {
        to {
          fill-opacity: 1;
          stroke-opacity: 0.35;
        }
      }
      .age {
        display: flex;
        align-items: center;
        gap: 16px;
        font: 500 0.72rem "Jost";
        letter-spacing: 0.35em;
        text-transform: uppercase;
        opacity: 0;
        transition: opacity 1.5s;
      }
      .age::before,
      .age::after {
        content: "";
        width: 34px;
        height: 1px;
        background: var(--jaune);
      }
      .age.visible {
        opacity: 1;
      }
      .typing {
        min-height: 5.5em;
        margin-top: 26px;
        max-width: 420px;
        font: italic 1.3rem "Cormorant Garamond";
        color: rgba(244, 247, 255, 0.85);
      }
      .curseur {
        display: inline-block;
        width: 1px;
        height: 1em;
        background: var(--jaune);
        vertical-align: -2px;
        animation: clign 1s steps(1) infinite;
        margin-left: 2px;
      }
      @keyframes clign {
        50% {
          opacity: 0;
        }
      }
      .hero .suite {
        margin-top: 26px;
        opacity: 0;
        transition: opacity 1.5s;
      }
      .hero .suite.visible {
        opacity: 1;
      }

      /* ===== Nuit (bougies) ===== */
      #nuit {
        position: fixed;
        inset: 0;
        z-index: 40;
        background: #02050d;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 1.2s ease,
          background 2s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 30px;
      }
      #nuit.aube {
        background: radial-gradient(
          circle at 50% 50%,
          rgba(var(--jaune-rgb), 0.32),
          #02050d 62%
        );
        transition:
          opacity 3.4s ease,
          background 1.2s ease;
      }
      #nuitTexte {
        font: italic 500 clamp(1.8rem, 8vw, 2.6rem) "Cormorant Garamond";
        color: var(--pale);
        text-align: center;
        opacity: 0;
        transform: scale(0.96);
        transition:
          opacity 1.6s ease,
          transform 3s ease;
      }
      #nuitTexte.visible {
        opacity: 1;
        transform: none;
      }
      .bougies.au-dessus {
        position: relative;
        z-index: 45;
      }
      .bougies.au-dessus .bougie.eteinte {
        filter: brightness(0.22);
        transition: filter 1.5s;
      }

      /* ===== Bougies ===== */
      .bougies {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: flex-end;
        gap: 54px 16px;
        max-width: 380px;
        margin: 60px auto 0;
        padding-bottom: 4px;
      }
      .bougie {
        position: relative;
        width: 12px;
        border-radius: 2px 2px 0 0;
        cursor: pointer;
        background: linear-gradient(90deg, #d9e1f2, #ffffff 40%, #cfd9ee);
      }
      .bougie::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: 12px;
        height: 3px;
        background: var(--jaune);
      }
      .bougie::before {
        content: "";
        position: absolute;
        left: 50%;
        top: -8px;
        width: 1px;
        height: 8px;
        background: #2a2a35;
      }
      .flamme {
        position: absolute;
        left: 50%;
        bottom: calc(100% + 6px);
        width: 12px;
        height: 26px;
        margin-left: -6px;
        border-radius: 50% 50% 45% 45%/60% 60% 40% 40%;
        background: radial-gradient(
          ellipse at 50% 75%,
          #fff 8%,
          #ffe6a8 30%,
          #f2b25c 60%,
          transparent 72%
        );
        transform-origin: 50% 100%;
        animation: vacille 0.18s infinite alternate;
        filter: drop-shadow(0 0 10px rgba(255, 190, 100, 0.9));
        transition:
          transform 0.35s,
          opacity 0.35s;
      }
      .flamme::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        width: 80px;
        height: 80px;
        margin: -40px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(255, 200, 120, 0.16),
          transparent 65%
        );
        pointer-events: none;
      }
      @keyframes vacille {
        from {
          transform: scale(1, 1) skewX(-2deg);
        }
        to {
          transform: scale(0.92, 1.1) skewX(2deg);
        }
      }
      .bougie.eteinte .flamme {
        transform: scale(0);
        opacity: 0;
      }
      .fumee {
        position: absolute;
        left: 50%;
        bottom: calc(100% + 10px);
        width: 6px;
        height: 6px;
        margin-left: -3px;
        border-radius: 50%;
        background: rgba(200, 210, 230, 0.45);
        opacity: 0;
      }
      .bougie.eteinte .fumee {
        animation: fumee 2.2s ease-out forwards;
      }
      @keyframes fumee {
        0% {
          opacity: 0.7;
        }
        100% {
          opacity: 0;
          transform: translate(8px, -80px) scale(5);
        }
      }
      .plateau {
        width: 85%;
        max-width: 360px;
        height: 1px;
        margin: 0 auto;
        background: linear-gradient(
          90deg,
          transparent,
          var(--jaune),
          transparent
        );
      }
      #infoBougies {
        margin-top: 28px;
        font: 500 0.7rem "Jost";
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--gris);
        min-height: 1.6em;
      }
      #voeu {
        font: italic 1.6rem "Cormorant Garamond";
        color: var(--pale);
        margin-top: 6px;
        opacity: 0;
        transform: translateY(14px);
        transition: all 1.6s var(--ease);
      }
      #voeu.visible {
        opacity: 1;
        transform: none;
      }

      /* ===== Chiffres ===== */
      .chiffres {
        display: grid;
        grid-template-columns: 1fr 1fr;
        border-top: 1px solid rgba(255, 255, 255, 0.14);
      }
      .chiffre {
        padding: 32px 8px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.14);
      }
      .chiffre:nth-child(odd) {
        border-right: 1px solid rgba(255, 255, 255, 0.14);
      }
      .chiffre b {
        display: block;
        font: 400 clamp(1.5rem, 7vw, 2.4rem) "Playfair Display";
        font-variant-numeric: tabular-nums;
        line-height: 1.2;
      }
      .chiffre span {
        display: block;
        margin-top: 8px;
        font: 500 0.62rem "Jost";
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--pale);
      }

      /* ===== Temps ===== */
      .temps {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
      }
      .temps div {
        padding: 6px 0;
      }
      .temps div + div {
        border-left: 1px solid rgba(var(--jaune-rgb), 0.25);
      }
      .temps b {
        display: block;
        font: 400 clamp(2rem, 10vw, 3rem) "Cormorant Garamond";
        color: var(--pale);
        font-variant-numeric: tabular-nums;
        line-height: 1.1;
      }
      .temps span {
        font: 500 0.58rem "Jost";
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--gris);
      }
      .temps.petit b {
        font-size: clamp(1.5rem, 7vw, 2.1rem);
        color: var(--blanc);
      }
      .note {
        margin-top: 22px;
        font: italic 1.1rem "Cormorant Garamond";
        color: var(--gris);
      }
      .sep {
        margin: 70px auto 26px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
      }
      .sep::before,
      .sep::after {
        content: "";
        width: 30px;
        height: 1px;
        background: rgba(var(--jaune-rgb), 0.5);
      }

      /* ===== Photos ===== */
      .photo {
        width: 86%;
        margin: 0 0 64px;
        text-align: left;
        cursor: zoom-in;
      }
      .photo:nth-child(even) {
        margin-left: auto;
        text-align: right;
      }
      .cadre {
        position: relative;
        aspect-ratio: 4/5;
        background: var(--bleu2);
        box-shadow: 0 30px 60px -25px rgba(0, 0, 0, 0.6);
      }
      .cadre .masque {
        position: absolute;
        inset: 0;
        overflow: hidden;
        clip-path: inset(0 0 100% 0);
        transition: clip-path 1.6s cubic-bezier(0.7, 0, 0.2, 1) 0.2s;
      }
      .photo.visible .masque {
        clip-path: inset(0 0 0 0);
      }
      .cadre img,
      .cadre .vide {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transform: scale(1.2);
        transition: transform 3s var(--ease) 0.2s;
      }
      .photo.visible .cadre img,
      .photo.visible .cadre .vide {
        transform: scale(1);
      }
      .cadre .vide {
        display: flex;

        height: 170px;

        opacity: 0;

          transform 1s var(--ease);

        opacity: 1;
        transform: none;

        position: relative;
        width: 100%;
        height: 100%;

        transform-style: preserve-3d;

        transform: rotateY(180deg);

        position: absolute;
        inset: 0;
        backface-visibility: hidden;

        flex-direction: column;
        align-items: center;
        justify-content: center;

        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--gris);

          #22468f,
          var(--bleu-roi)

        transform: rotateY(180deg);

        line-height: 1.35;

        position: absolute;
        left: 7px;
        top: 7px;
        width: calc(100% - 14px);
        height: calc(100% - 14px);
        overflow: visible;

        background: linear-gradient(160deg, #142b5f, #0c1b3f);

        position: absolute;

        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 22px;
        gap: 6px;
      }

        font: italic 1.6rem "Cormorant Garamond";
        line-height: 1.3;
      }
      .souligne {
        width: 70%;
        height: 14px;
        overflow: visible;
      }
      .grattage.revele .souligne path {
        animation: dessiner 1.6s cubic-bezier(0.6, 0, 0.2, 1) 0.6s forwards;
      }
      .grattage canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: pointer;
        transition: opacity 0.9s;
      }

      /* ===== Lettre ===== */
      .lettre {
        background: linear-gradient(165deg, #173270, #0c1b3f);
        text-align: left;
        padding: 48px 28px;
        box-shadow: 0 40px 70px -30px rgba(0, 0, 0, 0.8);
        font: 400 1.2rem/1.75 "Cormorant Garamond";
        position: relative;
      }
      .lettre > svg {
        position: absolute;
        left: 10px;
        top: 10px;
        width: calc(100% - 20px);
        height: calc(100% - 20px);
        overflow: visible;
        pointer-events: none;
      }
      .lettre.visible > svg rect {
        animation: dessiner 3s cubic-bezier(0.6, 0, 0.2, 1) 0.2s forwards;
      }
      .lettre p {
        margin-bottom: 18px;
        opacity: 0;
        transform: translateY(12px);
        transition:
          opacity 1.2s,
          transform 1.2s var(--ease);
      }
      .lettre.visible p {
        opacity: 1;
        transform: none;
      }
      .lettre p:first-of-type {
        font-style: italic;
        color: var(--pale);
      }

        float: left;

        color: var(--jaune);
        margin: 6px 8px 0 0;

      .lettre .signature {
        font: 400 2.4rem "Great Vibes";
        color: var(--pale);
        text-align: right;
        margin-top: 20px;
      }

      /* ===== Final ===== */

        min-height: 90svh;
        display: flex;
        align-items: center;

          ellipse at 50% 60%,

        margin-top: 20px;
        font: 500 0.72rem "Jost";
        letter-spacing: 0.35em;
        text-transform: uppercase;
        color: var(--jaune);
        background: transparent;
        border: 1px solid var(--jaune);
        padding: 18px 34px;
        cursor: pointer;
        position: relative;
        overflow: hidden;
        transition: color 0.5s;
        z-index: 0;
      }
      .bouton-jaune::before {
        content: "";
        position: absolute;
        inset: 0;
        background: var(--jaune);
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 0.6s var(--ease);
        z-index: -1;
      }
      .bouton-jaune:hover,

        color: var(--bleu);
      }
      .bouton-jaune:hover::before,
      .bouton-jaune:active::before {
        transform: scaleX(1);
      }

      /* ===== Scène finale ===== */
      #scene {
        position: fixed;
        inset: 0;
        z-index: 250;
        background: #03060f;
        opacity: 0;
        pointer-events: none;
        transition: opacity 2s ease;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 30px 22px;
        text-align: center;
        overflow: hidden;
      }
      #scene.actif {
        opacity: 1;
        pointer-events: auto;
      }
      .faisceau {
        position: absolute;
        left: 50%;
        top: -10%;

        height: 120%;
        transform: translateX(-50%);
        background: linear-gradient(
          180deg,
          rgba(var(--pale-rgb), 0.22),

          transparent 80%

        clip-path: polygon(44% 0, 56% 0, 100% 100%, 0 100%);
        filter: blur(18px);
        opacity: 0;
        transition: opacity 3s ease;
      }
      #scene.lumiere .faisceau {
        opacity: 1;
      }
      #scene > *:not(.faisceau) {
        position: relative;
        z-index: 1;
      }
      .coeur {
        width: 74px;
        height: 66px;
        overflow: visible;
        margin-bottom: 6px;
      }
      .coeur path {
        stroke-width: 1.4;
      }
      #scene.coeur-on .coeur path {
        animation: dessiner 2.6s cubic-bezier(0.5, 0, 0.3, 1) forwards;
      }
      #msgFinal {
        max-width: 460px;
        margin-top: 10px;

        color: var(--blanc);

      #signatureFinal {
        margin-top: 34px;

        margin-top: 22px;

        letter-spacing: 0.28em;

            "Je te souhaite une année remplie de joie, de réussite et d'amour. Et je compte bien être là pour chaque jour de cette nouvelle année.",
          ],
          signature: "H",
        },

        final: {
          titre: "Une dernière chose",
          bouton: "Ouvrir",
          message: "J'ai hâte qu'on se voie ce soir, lovyouuuuu", // s'écrit à la main dans la scène finale
          fermer: "Revenir au site",
        },

        piedDePage: "Fait avec amour par {lui}",
      };
      /* ================================================================== */

      const $ = (s) => document.querySelector(s);
      const C = CONFIG;
      const pad = (n) => String(n).padStart(2, "0");
      const fmtDate = (d) =>
        d.toLocaleDateString("fr-FR", {
          day: "numeric",
          month: "long",
          year: "numeric",
        });
      const remp = (t, o) =>
        String(t).replace(/\{(\w+)\}/g, (_, k) => o[k] ?? "");
      const T = (sel, txt) => {
        $(sel).textContent = txt;
      };
      const ROMAIN = [
        "I",
        "II",
        "III",
        "IV",
        "V",
        "VI",
        "VII",
        "VIII",
        "IX",
        "X",
        "XI",
        "XII",
      ];
      const NS = "http://www.w3.org/2000/svg";

      /* ----- Couleurs ----- */
      const hexRgb = (h) => {
        const n = parseInt(h.replace("#", ""), 16);
        return `${(n >> 16) & 255},${(n >> 8) & 255},${n & 255}`;
      };
      const st = document.documentElement.style;
      st.setProperty("--jaune", C.couleurs.jaune);
      st.setProperty("--jaune-rgb", hexRgb(C.couleurs.jaune));
      st.setProperty("--pale", C.couleurs.bleuPale);
      st.setProperty("--pale-rgb", hexRgb(C.couleurs.bleuPale));
      st.setProperty("--bleu", C.couleurs.bleuNuit);
      st.setProperty("--bleu-roi", C.couleurs.bleuRoi);
      st.setProperty("--blanc", C.couleurs.texte);
      st.setProperty("--rose", C.couleurs.erreur);

      /* ----- Calculs ----- */
      const naissance = new Date(C.elle.dateNaissance + "T00:00:00");
      const debut = new Date(C.dateDebutCouple + "T00:00:00");
      const age = new Date().getFullYear() - naissance.getFullYear(); // année actuelle - année de naissance
      const joursVie = Math.floor((Date.now() - naissance) / 864e5);
      const cibleCouple = (() => {
        const n = new Date();
        let a = new Date(n.getFullYear(), debut.getMonth(), debut.getDate());
        if (a <= n) a.setFullYear(a.getFullYear() + 1);
        return a;
      })();
      const nbBougies =
        C.gateau.nombreBougies === "age"
          ? age
          : Number(C.gateau.nombreBougies) || 1;

      /* ----- Prénom écrit à la plume (SVG) ----- */
      const policeNom = document.fonts.load('150px "Great Vibes"');
      function preparerNom(svg, texte) {
        const t = svg.querySelector("text");
        t.textContent = "";
        [...texte].forEach((ch, i) => {
          const s = document.createElementNS(NS, "tspan");
          s.textContent = ch;
          s.style.animationDelay = i * 0.22 + "s";
          t.appendChild(s);
        });
        t.style.animationDelay = texte.length * 0.22 + 0.9 + "s";
        const cadrer = () => {
          const b = t.getBBox();
          if (!b.width) return;
          const m = 24;
          svg.setAttribute(
            "viewBox",
            `${b.x - m} ${b.y - m} ${b.width + m * 2} ${b.height + m * 2}`,
          );
        };
        policeNom.then(() => requestAnimationFrame(cadrer));
        svg._cadrer = cadrer;
        return texte.length * 0.22 + 2.3; // durée totale de l'écriture (secondes)
      }
      const dureeNomHero = preparerNom($("#nomHero"), C.elle.prenom);
      preparerNom($("#nomFinal"), C.elle.prenom);

      /* ----- Textes ----- */
      document.title = `Joyeux anniversaire ${C.elle.prenom}`;
      T("#mono", C.elle.prenom.charAt(0));
      T("#vSur", remp(C.verrou.surtitre, { elle: C.elle.prenom }));
      T("#vTitre", C.verrou.titre);
      T("#vIndice", C.verrou.indice);
      [...C.hero.surtitre].forEach((ch, i) => {
        const s = document.createElement("span");
        s.textContent = ch === " " ? " " : ch;
        s.style.transitionDelay = 1.2 + i * 0.04 + "s";
        $("#heroSur").appendChild(s);
      });
      T("#heroAge", remp(C.hero.texteAge, { age }));
      T("#gTitre", C.gateau.titre);
      T("#gSous", C.gateau.sousTitre);
      T("#sTitre", C.stats.titre);
      T("#sSous", C.stats.sousTitre);
      C.stats.labels.forEach((l, i) => T("#sL" + (i + 1), l));
      T("#cTitre", C.couple.titre);
      T("#cSous", C.couple.sousTitre);
      T("#cDepuis", remp(C.couple.depuis, { date: fmtDate(debut) }));
      T("#rTitre", C.couple.reboursTitre);
      T("#rDate", remp(C.couple.reboursDate, { date: fmtDate(cibleCouple) }));
      T("#pTitre", C.photos.titre);
      T("#pSous", C.photos.sousTitre);
      T("#raTitre", C.raisons.titre);
      T("#raSous", C.raisons.sousTitre);
      T("#seTitre", C.secret.titre);
      T("#seSous", C.secret.sousTitre);
      T("#secret", C.secret.message);
      T("#lTitre", C.lettre.titre);
      T("#fTitre", C.final.titre);
      T("#btnFinal", C.final.bouton);
      T("#pied", remp(C.piedDePage, { lui: C.lui.prenom }));
      T("#signatureFinal", remp(C.piedDePage, { lui: C.lui.prenom }));
      T("#btnFermer", C.final.fermer);
      T("#relance", C.relance);
      T("#nuitTexte", C.gateau.momentVoeu);

      /* ----- Chapitres : numéros + teasers ----- */
      const chapitres = [...document.querySelectorAll("[data-chap]")];
      function teaser(texte, cible) {
        const d = document.createElement("div");
        d.className = "suite";
        const e = document.createElement("em");
        e.textContent = texte;
        d.append(e, document.createElement("i"));
        d.onclick = () => cible.scrollIntoView({ behavior: "smooth" });
        return d;
      }
      const teaserHero = teaser(C.teasers[0] || C.hero.defiler, chapitres[0]);
      $("#hero").appendChild(teaserHero);
      chapitres.forEach((sec, i) => {
        const inner = sec.querySelector(".inner");
        const sur = document.createElement("div");
        sur.className = "surtitre";
        sur.textContent =
          remp(C.chapitre, { n: ROMAIN[i] || i + 1 }) +
          " · " +
          ROMAIN[chapitres.length - 1];
        inner.querySelector("h2").before(sur);
        if (i < chapitres.length - 1 && C.teasers[i + 1])
          inner.appendChild(teaser(C.teasers[i + 1], chapitres[i + 1]));
      });

      /* ----- Lettre ----- */
      const lettre = $("#lettre");
      C.lettre.paragraphes.forEach((t, i) => {
        const p = document.createElement("p");
        p.textContent = t;
        p.style.transitionDelay = 0.8 + i * 0.6 + "s";
        lettre.appendChild(p);
      });
      const sig = document.createElement("p");
      sig.className = "signature";
      sig.textContent = remp(C.lettre.signature, { lui: C.lui.prenom });
      sig.style.transitionDelay = 0.8 + C.lettre.paragraphes.length * 0.6 + "s";
      lettre.appendChild(sig);

      /* ----- Bougies + moment dans le noir ----- */
      const nuit = $("#nuit"),
        zoneB = $("#bougies");
      const hauteurs = [70, 92, 80, 98, 74, 88, 84];
      let restantes = nbBougies,
        momentEnCours = false,
        voeuFait = false;
      const majB = () =>
        T(
          "#infoBougies",
          restantes > 0 ? remp(C.gateau.resteTexte, { n: restantes }) : "",
        );
      function obscurite() {
        if (voeuFait || momentEnCours) return;
        const o = (1 - restantes / nbBougies) * 0.72;
        nuit.style.opacity = o;
        zoneB.classList.toggle("au-dessus", o > 0);
      }
      function momentVoeu() {
        momentEnCours = true;
        zoneB.classList.remove("au-dessus");
        nuit.style.opacity = 0.97;
        setTimeout(() => $("#nuitTexte").classList.add("visible"), 1400);
        setTimeout(() => $("#nuitTexte").classList.remove("visible"), 5600);
        setTimeout(() => {
          nuit.classList.add("aube");
          nuit.style.opacity = 0;
        }, 7000);
        setTimeout(() => {
          zoneB.classList.remove("au-dessus");
          nuit.classList.remove("aube");
          T("#voeu", C.gateau.apresVoeu);
          $("#voeu").classList.add("visible");
          momentEnCours = false;
          voeuFait = true;
        }, 9800);
      }
      for (let i = 0; i < nbBougies; i++) {
        const b = document.createElement("div");
        b.className = "bougie";
        b.style.height = hauteurs[i % hauteurs.length] + "px";
        b.innerHTML = '<div class="flamme"></div><div class="fumee"></div>';
        b.onclick = () => {
          if (b.classList.contains("eteinte")) return;
          b.classList.add("eteinte");
          restantes--;
          majB();
          obscurite();
          if (restantes === 0) setTimeout(momentVoeu, 700);
        };
        zoneB.appendChild(b);
      }
      majB();
      // si elle quitte la section avant d'avoir fini, la page redevient normale
      new IntersectionObserver(
        (e) => {
          if (momentEnCours || voeuFait) return;
          if (e[0].isIntersecting) obscurite();
          else {
            nuit.style.opacity = 0;
            zoneB.classList.remove("au-dessus");
          }
        },
        { threshold: 0.3 },
      ).observe($("#chapBougies"));

      /* ----- Chiffres animés ----- */
      const valeurs = {
        age,
        jours: joursVie,
        nuits: joursVie,
        coeur: joursVie * 100800,
      };
      function compter(el) {
        const fin = valeurs[el.dataset.cible],
          t0 = performance.now(),
          d = 2600;
        (function f(t) {
          const k = Math.min(1, (t - t0) / d),
            e = 1 - Math.pow(1 - k, 4);
          el.textContent = Math.floor(fin * e).toLocaleString("fr-FR");
          if (k < 1) requestAnimationFrame(f);
        })(t0);
      }

      /* ----- Compteurs en direct ----- */
      const dec = (ms) => [
        Math.floor(ms / 864e5),
        Math.floor(ms / 36e5) % 24,
        Math.floor(ms / 6e4) % 60,
        Math.floor(ms / 1e3) % 60,
      ];
      function tick() {
        const [j, h, m, s] = dec(Math.max(0, Date.now() - debut));
        T("#cJ", j);
        T("#cH", pad(h));
        T("#cM", pad(m));
        T("#cS", pad(s));
        const [a, b, c, d] = dec(Math.max(0, cibleCouple - Date.now()));
        T("#rJ", a);
        T("#rH", pad(b));
        T("#rM", pad(c));
        T("#rS", pad(d));
      }
      tick();
      setInterval(tick, 1000);

      /* ----- Cadre SVG réutilisable ----- */
      function cadreSvg(couleur) {
        const svg = document.createElementNS(NS, "svg");
        svg.setAttribute("preserveAspectRatio", "none");
        const r = document.createElementNS(NS, "rect");
        r.setAttribute("x", "0");
        r.setAttribute("y", "0");
        r.setAttribute("width", "100%");
        r.setAttribute("height", "100%");
        r.setAttribute("pathLength", "1");
        r.setAttribute("class", "trace");
        if (couleur) r.style.stroke = couleur;
        svg.appendChild(r);
        return svg;
      }

      /* ----- Photos ----- */
      const lb = $("#lightbox");
      C.photos.liste.forEach((ph, i) => {
        const fig = document.createElement("figure");
        fig.className = "photo reveal";
        const cadre = document.createElement("div");
        cadre.className = "cadre";
        const masque = document.createElement("div");
        masque.className = "masque";
        const img = document.createElement("img");
        img.src = ph.src;
        img.alt = ph.legende;
        img.loading = "lazy";
        img.onerror = () => {
          const v = document.createElement("div");
          v.className = "vide";
          v.textContent = "Photo " + pad(i + 1);
          img.replaceWith(v);
        };
        masque.appendChild(img);
        cadre.append(
          masque,
          cadreSvg("rgba(" + hexRgb(C.couleurs.jaune) + ",.55)"),
        );
        const cap = document.createElement("figcaption");
        const n = document.createElement("span");
        n.className = "num";
        n.textContent = pad(i + 1);
        const em = document.createElement("em");
        em.textContent = ph.legende;
        if (i % 2) cap.append(em, n);
        else cap.append(n, em);
        fig.append(cadre, cap);
        fig.onclick = () => {
          const im = fig.querySelector("img");
          if (!im) return;
          lb.querySelector("img").src = im.src;
          lb.querySelector("p").textContent = ph.legende;
          lb.classList.add("ouvert");
        };
        $("#galerie").appendChild(fig);
      });
      lb.onclick = () => lb.classList.remove("ouvert");

      /* ----- Cartes ----- */
      const vues = new Set();
      const majC = () =>
        T(
          "#compteCartes",
          vues.size === C.raisons.liste.length
            ? C.raisons.fini
            : remp(C.raisons.reste, { n: C.raisons.liste.length - vues.size }),
        );
      C.raisons.liste.forEach((txt, i) => {
        const c = document.createElement("div");
        c.className = "carte";
        c.style.transitionDelay = i * 0.12 + "s";
        c.innerHTML = `<div class="carte-in"><div class="face avant"><b>${ROMAIN[i] || i + 1}</b><small></small></div><div class="face arriere"><span></span></div></div>`;
        c.querySelector("small").textContent = C.raisons.toucher;
        c.querySelector(".arriere span").textContent = txt;
        c.querySelector(".arriere").prepend(cadreSvg());
        c.onclick = () => {
          c.classList.toggle("retournee");
          if (!vues.has(i)) {
            vues.add(i);
            majC();
          }
        };
        $("#cartes").appendChild(c);
      });
      majC();

      /* ----- Grattage (feuille argent bleuté) ----- */
      (function () {
        const cv = $("#canvasGratte"),
          zone = $("#grattage"),
          ctx = cv.getContext("2d"),
          dpr = window.devicePixelRatio || 1;
        let fini = false,
          appui = false;
        function dessiner() {
          const w = zone.offsetWidth,
            h = zone.offsetHeight;
          cv.width = w * dpr;
          cv.height = h * dpr;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          const g = ctx.createLinearGradient(0, 0, w, h);
          g.addColorStop(0, "#7f9fd6");
          g.addColorStop(0.3, "#dbe7ff");
          g.addColorStop(0.5, C.couleurs.bleuPale);
          g.addColorStop(0.7, "#eef4ff");
          g.addColorStop(1, "#7f9fd6");
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, w, h);
          for (let i = 0; i < 900; i++) {
            ctx.fillStyle = `rgba(255,255,255,${Math.random() * 0.25})`;
            ctx.fillRect(Math.random() * w, Math.random() * h, 1, 1);
          }
          ctx.strokeStyle = "rgba(255,255,255,.6)";
          ctx.strokeRect(10.5, 10.5, w - 21, h - 21);
          ctx.fillStyle = "#0e1f4a";
          ctx.font = "500 11px Jost, sans-serif";
          ctx.textAlign = "center";
          if (ctx.letterSpacing !== undefined) ctx.letterSpacing = "4px";
          ctx.fillText(C.secret.couverture, w / 2, h / 2 + 4);
        }
        function gratter(e) {
          if (!appui || fini) return;
          const rc = cv.getBoundingClientRect();
          ctx.globalCompositeOperation = "destination-out";
          ctx.beginPath();
          ctx.arc(e.clientX - rc.left, e.clientY - rc.top, 24, 0, 7);
          ctx.fill();
        }
        function verifier() {
          const d = ctx.getImageData(0, 0, cv.width, cv.height).data;
          let vide = 0;
          for (let i = 3; i < d.length; i += 64) if (d[i] === 0) vide++;
          if (vide / (d.length / 64) > 0.5) {
            fini = true;
            cv.style.opacity = 0;
            zone.classList.add("revele");
            setTimeout(() => cv.remove(), 900);
          }
        }
        cv.addEventListener("pointerdown", (e) => {
          appui = true;
          cv.setPointerCapture(e.pointerId);
          gratter(e);
        });
        cv.addEventListener("pointermove", gratter);
        cv.addEventListener("pointerup", () => {
          appui = false;
          verifier();
        });
        document.fonts.ready.then(dessiner);
      })();

      /* ----- Machine à écrire ----- */
      function taper(el, texte, i = 0) {
        if (i > texte.length) return;
        el.textContent = texte.slice(0, i);
        setTimeout(() => taper(el, texte, i + 1), 42);
      }

      /* ----- Musique ----- */
      const audio = $("#audio"),
        btnM = $("#btnMusique");
      if (C.musique) {
        audio.src = C.musique;
        btnM.onclick = () => {
          if (audio.paused) {
            audio.play();
            btnM.classList.add("joue");
          } else {
            audio.pause();
            btnM.classList.remove("joue");
          }
        };
      }

      /* ----- Démarrage du site ----- */
      function demarrer() {
        document.body.classList.remove("verrou");
        $("#hero").classList.add("anime");
        if (C.musique) {
          btnM.style.display = "block";
          audio
            .play()
            .then(() => btnM.classList.add("joue"))
            .catch(() => {});
        }
        // 1. le cadre se trace  2. le titre apparaît  3. le prénom s'écrit  4. l'âge  5. le message
        policeNom.then(() => {
          $("#nomHero")._cadrer();
          setTimeout(() => $("#nomHero").classList.add("ecrit"), 2000);
        });
        const t = 2000 + dureeNomHero * 1000;
        setTimeout(() => $("#heroAge").classList.add("visible"), t - 600);
        setTimeout(() => taper($("#tape"), C.hero.message), t + 200);
        setTimeout(() => teaserHero.classList.add("visible"), t + 1800);
        surScroll();
      }

      /* ----- Verrou à code ----- */
      (function () {
        const v = $("#verrou");
        if (!C.verrou.actif) {
          v.remove();
          demarrer();
          return;
        }
        const code = String(C.verrou.code),
          casesEl = $("#cases");
        let saisie = "",
          bloque = false;
        for (let i = 0; i < code.length; i++)
          casesEl.appendChild(document.createElement("span"));
        const maj = () =>
          [...casesEl.children].forEach((c, i) =>
            c.classList.toggle("pleine", i < saisie.length),
          );
        function touche(k) {
          if (bloque) return;
          if (k === "⌫") {
            saisie = saisie.slice(0, -1);
            maj();
            return;
          }
          if (saisie.length >= code.length) return;
          saisie += k;
          maj();
          T("#erreurCode", "");
          if (saisie.length === code.length) {
            bloque = true;
            setTimeout(verifier, 300);
          }
        }
        function verifier() {
          if (saisie === code) {
            casesEl.classList.add("ok");
            setTimeout(() => {
              v.classList.add("ouvert");
              demarrer();
            }, 500);
            setTimeout(() => v.remove(), 2400);
          } else {
            casesEl.classList.add("erreur");
            T("#erreurCode", C.verrou.erreur);
            if (navigator.vibrate) navigator.vibrate(200);
            setTimeout(() => {
              casesEl.classList.remove("erreur");
              saisie = "";
              maj();
              bloque = false;
            }, 650);
          }
        }
        ["1", "2", "3", "4", "5", "6", "7", "8", "9", "", "0", "⌫"].forEach(
          (k) => {
            const b = document.createElement("button");
            if (k === "") b.className = "vide";
            if (k === "⌫") {
              b.className = "eff";
              b.textContent = C.verrou.effacer;
            } else b.textContent = k;
            b.onclick = () => touche(k);
            $("#clavier").appendChild(b);
          },
        );
        addEventListener("keydown", (e) => {
          if (!document.body.contains(v)) return;
          if (/^\d$/.test(e.key)) touche(e.key);
          if (e.key === "Backspace") touche("⌫");
        });
      })();

      /* ----- Apparitions au scroll ----- */
      const obs = new IntersectionObserver(
        (es) =>
          es.forEach((e) => {
            if (!e.isIntersecting) return;
            e.target.classList.add("visible");
            if (e.target.closest("#stats"))
              e.target.querySelectorAll("[data-cible]").forEach(compter);
            obs.unobserve(e.target);
          }),
        { threshold: 0.15 },
      );
      document.querySelectorAll(".reveal").forEach((el) => obs.observe(el));

      /* ----- Progression + relance ----- */
      let minuteur;
      function surScroll() {
        const max = document.documentElement.scrollHeight - innerHeight,
          pct = max > 0 ? scrollY / max : 0;
        $("#progression").style.width = pct * 100 + "%";
        $("#relance").classList.remove("montre");
        clearTimeout(minuteur);
        if (pct < 0.94 && !document.body.classList.contains("verrou"))
          minuteur = setTimeout(
            () => $("#relance").classList.add("montre"),
            9000,
          );
      }
      addEventListener("scroll", surScroll, { passive: true });
      $("#relance").onclick = () => {
        const s = chapitres.find((c) => c.getBoundingClientRect().top > 80);
        (s || chapitres.at(-1)).scrollIntoView({ behavior: "smooth" });
      };

      /* ----- Scène finale : noir, faisceau, cœur tracé, prénom écrit, message à la main ----- */
      (function () {
        const msg = $("#msgFinal");
        let dl = 0;
        C.final.message
          .split(/\s+/)
          .filter(Boolean)
          .forEach((mot) => {
            const s = document.createElement("span");
            s.textContent = mot;
            const d = Math.max(0.35, mot.length * 0.09);
            s.style.setProperty("--d", d + "s");
            s.style.setProperty("--delai", dl + "s");
            dl += d + 0.08;
            msg.appendChild(s);
          });
        const dureeMsg = dl;
        const scene = $("#scene"),
          nomF = $("#nomFinal");
        $("#btnFinal").onclick = () => {
          clearTimeout(minuteur);
          $("#relance").classList.remove("montre");
          document.body.classList.add("verrou");
          scene.classList.add("actif");
          requestAnimationFrame(() => nomF._cadrer());
          setTimeout(() => scene.classList.add("lumiere"), 1800);
          setTimeout(() => scene.classList.add("coeur-on"), 2600);
          setTimeout(() => nomF.classList.add("ecrit"), 4600);
          const debutMsg = 4600 + C.elle.prenom.length * 220 + 1600;
          setTimeout(() => msg.classList.add("go"), debutMsg);
          setTimeout(
            () => scene.classList.add("fin"),
            debutMsg + dureeMsg * 1000 + 800,
          );
        };
        $("#btnFermer").onclick = () => {
          scene.classList.remove("actif");
          document.body.classList.remove("verrou");
        };
      })();
    </script>
  </body>
</html>
